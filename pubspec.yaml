name: bebek_monitor_clean
description: "Ninni - bebek monitörü"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  wakelock_plus: ^1.2.5
  vibration: ^3.1.4
  cupertino_icons: ^1.0.8
  camera: ^0.11.2
  permission_handler: ^12.0.1
  provider: ^6.0.5
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  flutter_webrtc: ^0.12.5
  nearby_connections: ^4.3.0
  device_info_plus: 9.1.2
  image: ^4.7.2
  flutter_image_compress: ^2.4.0
  gal: ^2.3.0
  path_provider: ^2.1.2
  battery_plus: ^7.0.0
  video_player: ^2.10.1
  chewie: ^1.13.0
  share_plus: ^12.0.1
  video_thumbnail: ^0.5.6
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^19.5.0
  screen_brightness: ^2.1.11
  firebase_auth: ^5.7.0
  record: ^7.2.0
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6
  animations: ^3.0.0

dependency_overrides:
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.8

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/ninni_icon_1024.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#12142B"
  adaptive_icon_foreground: "assets/icon/ninni_foreground_1024.png"

flutter_native_splash:
  color: "#12142B"
  image: assets/icon/ninni_splash_768.png
  android_12:
    color: "#12142B"
    image: assets/icon/ninni_splash_768.png
    icon_background_color: "#12142B"
  ios: true
  android: true
  web: false

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
