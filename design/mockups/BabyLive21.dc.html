      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <span style="font-size: 26px; font-weight: 800; line-height: 1">42</span>
        <span style="font-size: 11px; font-weight: 700; color: #A9ADCF">dB</span>
      </div>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <div style="display: flex; justify-content: space-between; align-items: baseline">

        <span style="font-size: 12px; font-weight: 700; color: #FFB494">Eşik 60</span>
      </div>
      <div style="position: relative; height: 44px; display: flex; align-items: flex-end; gap: 3px">

          <span style="flex: 1; border-radius: 2px; height: {{b.h}}; background: {{b.c}}"></span>
        </sc-for>
        <span style="position: absolute; left: 0; right: 0; bottom: 30px; border-top: 1.5px dashed #FF8A5B; opacity: 0.6"></span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: #A9ADCF"><span>Son 1 saat</span><span>1 alarm · 01:12</span></div>

      <span style="font-size: 12px; font-weight: 600; color: #A9ADCF">Işık</span>
      <span style="font-size: 14px; font-weight: 800">Kehribar</span>
    </div>
  </div>

  <a href="BabyNight.dc.html" style="margin-top: auto; text-decoration: none; height: 62px; border-radius: 20px; background: #5B5BF0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 800">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
    Gece moduna geç
  </a>
  <button type="button" style="height: 44px; border: none; background: transparent; color: #FFB494; font: 700 15px 'Plus Jakarta Sans', sans-serif">Yayını bitir</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
