body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
a{color:#B9B9FF}a:hover{color:#FFFFFF}

@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}

.star{animation:twinkle 3s ease-in-out infinite}
